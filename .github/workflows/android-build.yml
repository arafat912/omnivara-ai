name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - build/android-eas-pipeline
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: write

jobs:
  build-android:
    name: Build OMNIVARA Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install mobile dependencies and generate lockfile
        working-directory: mobile
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Commit generated mobile lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Add mobile npm lockfile for reproducible EAS builds"
            git push
          fi

      - name: Start Android preview build and wait for completion
        working-directory: mobile
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Download generated APK from EAS
        working-directory: mobile
        run: eas build:download --latest --platform android --path ./omnivara-preview.apk

      - name: Upload APK as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnivara-android-apk
          path: mobile/omnivara-preview.apk
          if-no-files-found: error
          retention-days: 7
